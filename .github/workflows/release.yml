name: Build & Release APK

# Push a tag like v1.0.1 to publish a new APK:   git tag v1.0.1 && git push origin v1.0.1
# You can also run it by hand from the Actions tab (builds the APK as an artifact, no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing — add it under Settings > Secrets and variables > Actions"; exit 1; fi
          done
          # Strip anything that isn't base64 (spaces, line breaks, quotes picked up while pasting).
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          echo "KEYSTORE_BASE64: ${#KEYSTORE_BASE64} chars pasted, ${#CLEAN} valid (expected 5740)"
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" || { echo "::error::KEYSTORE_BASE64 is not valid — paste keystore-base64.txt again"; exit 1; }
          A=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')" -alias "$A" >/dev/null \
            || { echo "::error::Keystore decoded but KEYSTORE_PASSWORD or KEY_ALIAS does not match"; exit 1; }
          echo "Signing key OK"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName=${{ steps.ver.outputs.name }} \
            -PversionCode=${{ github.run_number }} \
            -PgithubRepo=${{ github.repository }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LedgerSync-v${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LedgerSync-v${{ steps.ver.outputs.name }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            **Install:** download the APK below on the phone → open it → allow "Install unknown apps" if asked.
            Already installed? Just install this over it — your data and connection are kept.
